name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create --project-name phone_shop --platforms=android .
      - run: cp main.dart lib/main.dart
      - run: flutter pub add shared_preferences mobile_scanner pdf printing
      - run: sed -i 's/flutter.minSdkVersion/24/' android/app/build.gradle*
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA"/><application#' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: build/app/outputs/flutter-apk/app-release.apk
